<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Live Stream</title>

<style>
  body {
    margin:0;
    background:#000;
    font-family:system-ui;
    color:#fff;
  }

  #wrap {
    position:relative;
    width:100%;
    height:100vh;
  }

  video {
    width:100%;
    height:100%;
    object-fit:fill;
    background:#000;
  }

  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    background:#000;
  }

  .spinner {
    width:35px;
    height:35px;
    border:3px solid #333;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform:rotate(360deg); }
  }

  button {
    padding:10px 20px;
    border:none;
    border-radius:6px;
    background:#fff;
    color:#000;
    font-size:14px;
    cursor:pointer;
    display:none;
  }
</style>
</head>

<body>

<div id="wrap">
  <video id="video" muted playsinline controls></video>

  <div id="overlay">
    <div class="spinner"></div>
    <div id="status">Connecting stream...</div>
    <button id="playBtn">Play Stream</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

const params  = new URLSearchParams(location.search);
const idx     = params.get("s") || 0;
// const baseUrl = `/hls/stream${idx}/playlist.m3u8`;
const mode = params.get("mode") || "raw";

const baseUrl = `/hls/stream${idx}_${mode}/playlist.m3u8`;

const video   = document.getElementById("video");
const overlay = document.getElementById("overlay");
const status  = document.getElementById("status");
const btn     = document.getElementById("playBtn");

btn.onclick = () => video.play().then(hideOverlay);

function hideOverlay() {
  overlay.style.display = "none";
}

function showOverlay(msg) {
  overlay.style.display = "flex";
  status.innerText = msg || "Connecting stream...";
  btn.style.display = "none";
}

/* ── PLAYER (recreated on each retry) ─────────────── */
function initHls() {

  showOverlay("Connecting stream...");

  const url = `${baseUrl}?t=${Date.now()}`;
  let overlayHidden = false;

  function startPlayback() {
    if (overlayHidden) return;
    overlayHidden = true;

    video.muted = true;
    video.play()
      .then(hideOverlay)
      .catch(() => {
        /* autoplay blocked — show manual play button */
        overlay.style.display = "flex";
        status.innerText = "Click play to start";
        btn.style.display = "block";
      });
  }

  /* native video fallbacks */
  video.addEventListener("loadeddata", startPlayback, { once: true });
  video.addEventListener("canplay",    startPlayback, { once: true });

  if (!Hls.isSupported()) {
    video.src = url;
    video.load();
    setTimeout(startPlayback, 500);
    return;
  }

  const hls = new Hls({
    /* ── Buffer ────────────────────────────────── */
    lowLatencyMode: false,
    liveSyncDurationCount: 3,
    liveMaxLatencyDurationCount: 12,
    liveBackBufferLength: 0,
    backBufferLength: 0,
    maxBufferLength: 10,
    maxMaxBufferLength: 20,

    /* ── Startup tolerance ─────────────────────── */
    manifestLoadingTimeOut:  15000,
    manifestLoadingMaxRetry: 8,
    manifestLoadingRetryDelay: 1000,

    levelLoadingTimeOut:  15000,
    levelLoadingMaxRetry: 6,

    fragLoadingTimeOut:  20000,
    fragLoadingMaxRetry: 6,

    /* ── Live edge ─────────────────────────────── */
    startPosition: -1,
  });

  hls.loadSource(url);
  hls.attachMedia(video);

  /* first real frame buffered → go live */
  hls.on(Hls.Events.FRAG_BUFFERED, startPlayback);

  /* safety: unblock 2s after manifest arrives */
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    setTimeout(startPlayback, 2000);
  });

  /* fatal error → destroy + retry without page reload */
  hls.on(Hls.Events.ERROR, (_, data) => {
    if (!data.fatal) return;
    console.warn(`[stream${idx}] fatal error, retrying in 4s`);
    hls.destroy();
    showOverlay("Reconnecting...");
    setTimeout(() => initHls(), 4000);
  });
}

initHls();

</script>

</body>
</html>
